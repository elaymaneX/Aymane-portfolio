backend:
  name: github
  repo: elaymaneX/Aymane-portofolio
  branch: main
  base_url: https://aymane-portofolio-eta.vercel.app
  auth_endpoint: /api/auth

# Lets /admin on localhost edit local files when `npx decap-server` is running; ignored in production
local_backend: true

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tag", name: "tag", widget: "string", hint: "e.g. AI, Finance, Research" }
      - { label: "Tag Color", name: "tagColor", widget: "color", default: "#3B6CF4" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Type"
        name: "type"
        widget: "select"
        default: "analysis"
        options:
          - { label: "App / website (card links to the live site)", value: "app" }
          - { label: "Analysis / tool (card opens its own page)", value: "analysis" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Accent", name: "accent", widget: "boolean", default: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Shown on the project card" }
      - { label: "Icon", name: "icon", widget: "select", options: ["signal", "web", "automation", "code"], default: "code" }
      - { label: "Icon Background", name: "iconBg", widget: "color", default: "#3B6CF4" }
      - { label: "Live URL", name: "externalUrl", widget: "string", required: false, hint: "Required for App / website projects" }
      - { label: "Colab URL", name: "colabUrl", widget: "string", required: false, hint: "Analysis / tool: shown as an 'Open in Colab' button" }
      - { label: "Code URL", name: "repoUrl", widget: "string", required: false, hint: "Analysis / tool: GitHub repo, shown as a 'View code' button" }
      - label: "Key stats"
        name: "stats"
        widget: "list"
        required: false
        hint: "Analysis / tool: headline numbers shown at the top of the page"
        fields:
          - { label: "Value", name: "value", widget: "string", hint: "e.g. 3.7×" }
          - { label: "Label", name: "label", widget: "string", hint: "e.g. Error reduction" }
      - label: "Results gallery"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Analysis / tool: charts and screenshots shown under Results"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Analysis / tool: the write-up. Use code blocks for snippets. Not shown for App / website projects." }
