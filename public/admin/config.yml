backend:
  name: github
  repo: elaymaneX/Aymane-portofolio
  branch: main
  base_url: https://aymane-portofolio-eta.vercel.app
  auth_endpoint: /api/auth

# Lets /admin on localhost edit local files when `npx decap-server` is running; ignored in production
local_backend: true

# Translations: each entry is saved as <folder>/<locale>/<slug>.mdx.
# Only English is required; empty Spanish/French versions fall back to English on the site.
i18n:
  structure: multiple_folders
  locales: [en, es, fr]
  default_locale: en

media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
      - { label: "Tag", name: "tag", widget: "string", hint: "e.g. AI, Finance, Research", i18n: true }
      - { label: "Tag Color", name: "tagColor", widget: "color", default: "#3B6CF4", i18n: duplicate }
      - { label: "Excerpt", name: "excerpt", widget: "text", i18n: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, i18n: duplicate }
      - label: "Type"
        name: "type"
        widget: "select"
        i18n: duplicate
        default: "analysis"
        options:
          - { label: "App / website (card links to the live site)", value: "app" }
          - { label: "Analysis / tool (card opens its own page)", value: "analysis" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Accent", name: "accent", widget: "boolean", default: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Shown on the project card", i18n: true }
      - { label: "Cover image", name: "cover", widget: "image", required: false, hint: "Screenshot or chart shown on the project card; landscape (16:9) works best. Without one, the card shows the icon", i18n: duplicate }
      - { label: "Icon", name: "icon", widget: "select", options: ["signal", "web", "automation", "code"], default: "code", i18n: duplicate }
      - { label: "Icon Background", name: "iconBg", widget: "color", default: "#3B6CF4", i18n: duplicate }
      - { label: "Live URL", name: "externalUrl", widget: "string", required: false, hint: "App / website: the card links here. Leave empty if it isn't live yet; the card won't be clickable", i18n: duplicate }
      - { label: "Colab URL", name: "colabUrl", widget: "string", required: false, hint: "Analysis / tool: shown as an 'Open in Colab' button", i18n: duplicate }
      - { label: "Code URL", name: "repoUrl", widget: "string", required: false, hint: "Analysis / tool: GitHub repo, shown as a 'View code' button", i18n: duplicate }
      - label: "Key stats"
        name: "stats"
        widget: "list"
        i18n: true
        required: false
        hint: "Analysis / tool: headline numbers shown at the top of the page"
        fields:
          - { label: "Value", name: "value", widget: "string", hint: "e.g. 3.7×" }
          - { label: "Label", name: "label", widget: "string", hint: "e.g. Error reduction" }
      - label: "Results gallery"
        name: "gallery"
        widget: "list"
        i18n: true
        required: false
        hint: "Analysis / tool: charts and screenshots shown under Results"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, i18n: duplicate }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Analysis / tool: the write-up. Use code blocks for snippets. Not shown for App / website projects.", i18n: true }
